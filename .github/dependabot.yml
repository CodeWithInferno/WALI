version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Security updates remain enabled; routine version-update PRs are disabled.
    open-pull-requests-limit: 0
  - package-ecosystem: gomod
    directory: /Services/WALIMediaWorker
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /Services/WALIClassifier
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /Services/WALIMediaSandbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /Services/WALIClassifier
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
