name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 7 * * 3"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.74.0
      - run: ./scripts/check-licenses.sh

  history-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_root="$RUNNER_TEMP/wali-gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 "$GITLEAKS_URL" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root" gitleaks
          test "$("$install_root/gitleaks" version)" = "8.30.1"
          echo "$install_root" >> "$GITHUB_PATH"
      - name: Test history scanning and redaction
        run: python3 Tests/Security/check-secrets-tests.py
      - name: Scan all fetched history
        run: ./scripts/check-secrets.sh

  dependency-review:
    # GitHub's dependency-review API is unavailable while this repository is
    # private without Advanced Security. Enforce it automatically when the
    # repository is opened to the public.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: AGPL-3.0-only,AGPL-3.0-or-later
