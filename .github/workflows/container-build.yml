name: Marketplace containers

on:
  pull_request:
    paths:
      - Services/**
      - .github/workflows/container-build.yml
  push:
    branches: [main]
    paths:
      - Services/**
      - .github/workflows/container-build.yml

permissions:
  contents: read

concurrency:
  group: marketplace-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: media-sandbox
            context: Services/WALIMediaSandbox
            file: Services/WALIMediaSandbox/Containerfile
          - name: classifier
            context: Services/WALIClassifier
            file: Services/WALIClassifier/Containerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          provenance: mode=max
          sbom: true
          outputs: type=oci,dest=/tmp/${{ matrix.name }}.tar
      - name: Record immutable build digest
        run: |
          test -n "${{ steps.build.outputs.digest }}"
          case "${{ steps.build.outputs.digest }}" in sha256:*) ;; *) exit 1 ;; esac
          echo "${{ matrix.name }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
