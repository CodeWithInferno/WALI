name: Marketplace CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketplace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ruby scripts/check-marketplace-contracts.rb
      - run: ./scripts/generate-sbom.sh --verify-clean
      - run: ./scripts/check-licenses.sh
      - run: git diff --check

  swift:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the verified Xcode toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app
          xcrun swift --version | grep -E 'Swift version 6\.2([. ]|$)'
      - name: Install pinned XcodeGen
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-release"
          curl --fail --location --proto '=https' --tlsv1.2 "$XCODEGEN_URL" --output "$archive"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_root"
          test "$("$install_root/xcodegen/bin/xcodegen" --version | awk '{print $2}')" = "2.44.1"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
      - run: make verify

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.116.0
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.6
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase test db
      - run: supabase db lint --local --level warning --fail-on error
      - run: deno fmt --check supabase/functions
      - run: deno check supabase/functions/*/index.ts supabase/functions/tests/*.ts
      - run: deno lint supabase/functions
      - run: deno test --allow-env --allow-net=127.0.0.1 supabase/functions/tests

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.25.0
          cache-dependency-path: Services/WALIMediaWorker/go.sum
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.8.17
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: Services/WALIClassifier/uv.lock
      - run: cd Services/WALIMediaWorker && go vet ./... && go test -race ./...
      - run: cd Services/WALIClassifier && uv lock --check && uv run --frozen pytest
      - run: ./Services/WALIMediaSandbox/tests/run-corpus.sh
      - name: Build ephemeral hostile-media runtime image
        run: |
          docker build --platform linux/amd64 --iidfile /tmp/wali-sandbox-image.id \
            --file Services/WALIMediaSandbox/Containerfile Services/WALIMediaSandbox
          grep -Eq '^sha256:[0-9a-f]{64}$' /tmp/wali-sandbox-image.id
      - name: Run hostile corpus inside isolated Docker runtime
        run: |
          WALI_CONTAINER_RUNTIME=docker \
          WALI_SANDBOX_IMAGE="$(cat /tmp/wali-sandbox-image.id)" \
          ./Services/WALIMediaSandbox/tests/run-corpus.sh --runtime
      - run: ./scripts/verify-worker-isolation.sh
