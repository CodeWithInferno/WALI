---
name: WALI
options:
  bundleIdPrefix: com.wali
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    macOS: '15.0'
  generateEmptyDirectories: true
  minimumXcodeGenVersion: 2.44.1
  xcodeVersion: '26.2'
configs:
  Debug: debug
  Development: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Development: Config/Development.xcconfig
  Release: Config/Release.xcconfig
packages:
  WALICore:
    path: Packages/WALICore
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: '6.0'
targets:
  WALI:
    templates:
    - CommonWALI
    settings:
      configs:
        Development:
          CODE_SIGN_ENTITLEMENTS: Config/WALI.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/WALI-Release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "$(WALI_APP_PROVISIONING_PROFILE)"
    sources:
    - path: Config/LaunchAgents
      buildPhase:
        copyFiles:
          destination: wrapper
          subpath: Contents/Library/LaunchAgents
    info:
      properties:
        WALILockScreenHelperLaunchAgentPlistName: "$(WALI_LOCK_SCREEN_HELPER_BUNDLE_IDENTIFIER).plist"
    dependencies:
    - target: WALILockScreenHelper
      embed: true
      link: false
      codeSign: true
      copy:
        destination: wrapper
        subpath: Contents/Library/LoginItems
  WALIAppRuntime:
    templates:
    - CommonWALIAppRuntime
  WALICatalogRuntime:
    templates:
    - CommonWALICatalogRuntime
  WALIAgent:
    templates:
    - CommonWALIAgent
    settings:
      configs:
        Development:
          CODE_SIGN_ENTITLEMENTS: Config/WALIAgent.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/WALIAgent.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "$(WALI_AGENT_PROVISIONING_PROFILE)"
    info:
      properties:
        WALILockScreenHelperServiceName: "$(WALI_LOCK_SCREEN_HELPER_SERVICE_NAME)"
        WALILockScreenHelperBundleIdentifier: "$(WALI_LOCK_SCREEN_HELPER_BUNDLE_IDENTIFIER)"
  WALIAgentRuntime:
    templates:
    - CommonWALIAgentRuntime
    dependencies:
    - package: WALICore
      product: WALILockScreenWire
  WALILockScreenHelper:
    type: application
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: Sources/WALILockScreenHelper
    - path: Resources/WALIAssets.xcassets
    info:
      path: Config/Generated/WALILockScreenHelper-Info.plist
      properties:
        CFBundleDisplayName: WALI Lock Screen Helper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSHighResolutionCapable: true
        WALILockScreenHelperServiceName: "$(WALI_LOCK_SCREEN_HELPER_SERVICE_NAME)"
        WALIExpectedAgentBundleIdentifier: "$(WALI_AGENT_BUNDLE_IDENTIFIER)"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: "$(WALI_LOCK_SCREEN_HELPER_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: WALILockScreenHelper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
      configs:
        Development:
          CODE_SIGN_ENTITLEMENTS: Config/WALILockScreenHelper.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/WALILockScreenHelper.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "$(WALI_HELPER_PROVISIONING_PROFILE)"
    dependencies:
    - target: WALILockScreenHelperRuntime
  WALILockScreenHelperRuntime:
    type: framework.static
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: Sources/WALILockScreenHelperRuntime
    - path: Sources/WALIAgentRuntime/LockScreen/AerialManifestEditor.swift
    - path: Sources/WALIAgentRuntime/LockScreen/WallpaperStoreEditor.swift
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wali.WALILockScreenHelperRuntime
        PRODUCT_NAME: WALILockScreenHelperRuntime
        SKIP_INSTALL: true
    dependencies:
    - package: WALICore
      product: WALILockScreenWire
  WALITranscoder:
    templates:
    - CommonWALITranscoder
  WALITranscoderRuntime:
    templates:
    - CommonWALITranscoderRuntime
  WALIUI:
    templates:
    - CommonWALIUI
  WALIAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: Tests/WALIAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wali.WALIAppTests
    dependencies:
    - target: WALIAppRuntime
    - package: WALICore
      product: WALIModel
    - package: WALICore
      product: WALIWire
    - target: WALICatalogRuntime
    - target: WALIUI
    - package: WALICore
      product: WALICatalog
  WALICatalogRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: Tests/WALICatalogRuntimeTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wali.WALICatalogRuntimeTests
    dependencies:
    - target: WALICatalogRuntime
    - package: WALICore
      product: WALICatalog
  WALIAgentTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: Tests/WALIAgentTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wali.WALIAgentTests
    dependencies:
    - target: WALIAgentRuntime
    - package: WALICore
      product: WALIWire
    - package: WALICore
      product: WALIEngine
    - package: WALICore
      product: WALIModel
    - package: WALICore
      product: WALICatalog
    - package: WALICore
      product: WALILockScreenWire
  WALITranscoderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: Tests/WALITranscoderTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wali.WALITranscoderTests
    dependencies:
    - target: WALITranscoderRuntime
    - package: WALICore
      product: WALIWire
  WALILockScreenHelperTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: Tests/WALILockScreenHelperTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wali.WALILockScreenHelperTests
    dependencies:
    - target: WALILockScreenHelperRuntime
    - package: WALICore
      product: WALILockScreenWire
  WALIUITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: Tests/WALIUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wali.WALIUITests
    dependencies:
    - target: WALIUI
  WALIEndToEndTests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - path: UITests/WALIEndToEndTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wali.WALIEndToEndTests
    dependencies:
    - target: WALI
schemes:
  WALIAgentTests:
    build:
      targets:
        WALIAgentTests: test
    test:
      config: Debug
      targets:
      - WALIAgentTests
    management:
      shared: true
  WALILockScreenHelperTests:
    build:
      targets:
        WALILockScreenHelperTests: test
    test:
      config: Debug
      targets:
      - WALILockScreenHelperTests
    management:
      shared: true
  WALI:
    build:
      targets:
        WALI: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
      - WALIAppTests
      - WALICatalogRuntimeTests
      - WALIAgentTests
      - WALITranscoderTests
      - WALILockScreenHelperTests
      - WALIUITests
      - WALIEndToEndTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
include:
- project-common.yml
