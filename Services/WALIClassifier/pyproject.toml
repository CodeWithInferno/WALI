[project]
name = "wali-classifier"
version = "0.1.0"
description = "Offline deterministic taxonomy suggestions for canonical WALI media"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
inference = [
  "numpy==2.2.6",
  "pillow==11.3.0",
  "safetensors==0.5.3",
  "torch==2.7.1",
  "transformers==4.53.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
