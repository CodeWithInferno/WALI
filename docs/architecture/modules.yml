edges:
  current:
    build:
      - from: WALI
        to: WALIAppRuntime
      - from: WALIAppRuntime
        to: WALIUI
      - from: WALIAgent
        to: WALIAgentRuntime
      - from: WALIAgentRuntime
        to: WALIUI
      - from: WALITranscoder
        to: WALITranscoderRuntime
    package:
      - from: WALIAppRuntime
        to: WALIModel
      - from: WALIAppRuntime
        to: WALIWire
      - from: WALIAgentRuntime
        to: WALIModel
      - from: WALIAgentRuntime
        to: WALIWire
      - from: WALIAgentRuntime
        to: WALIEngine
      - from: WALITranscoderRuntime
        to: WALIModel
      - from: WALITranscoderRuntime
        to: WALIWire
      - from: WALIUI
        to: WALIModel
    embed_only:
      - from: WALI
        to: WALIAgent
      - from: WALIAgent
        to: WALITranscoder

  target:
    build:
      - from: WALI
        to: WALIAppRuntime
      - from: WALIAppRuntime
        to: WALIUI
      - from: WALIAgent
        to: WALIAgentRuntime
      - from: WALIAgentRuntime
        to: WALIUI
      - from: WALITranscoder
        to: WALITranscoderRuntime
    package:
      - from: WALIAppRuntime
        to: WALIModel
      - from: WALIAppRuntime
        to: WALIWire
      - from: WALIAgentRuntime
        to: WALIModel
      - from: WALIAgentRuntime
        to: WALIWire
      - from: WALIAgentRuntime
        to: WALIEngine
      - from: WALITranscoderRuntime
        to: WALIModel
      - from: WALITranscoderRuntime
        to: WALIWire
      - from: WALIUI
        to: WALIModel
    embed_only:
      - from: WALI
        to: WALIAgent
      - from: WALIAgent
        to: WALITranscoder
