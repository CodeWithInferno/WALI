schema_version: 3
schema_document: docs/architecture/modules-schema.md

swift_packages:
  WALICore:
    xcodegen_reference:
      name: WALICore
      path: Packages/WALICore
    current:
      products:
        WALIModel:
          kind: library
          linkage: static
          targets:
            - WALIModel
        WALIWire:
          kind: library
          linkage: static
          targets:
            - WALIWire
        WALIEngine:
          kind: library
          linkage: static
          targets:
            - WALIEngine
      targets:
        WALIModel:
          kind: regular
          path: Sources/WALIModel
          dependencies: []
        WALIWire:
          kind: regular
          path: Sources/WALIWire
          dependencies:
            - WALIModel
        WALIEngine:
          kind: regular
          path: Sources/WALIEngine
          dependencies:
            - WALIModel
        WALIModelTests:
          kind: test
          path: Tests/WALIModelTests
          dependencies:
            - WALIModel
        WALIWireTests:
          kind: test
          path: Tests/WALIWireTests
          dependencies:
            - WALIWire
        WALIEngineTests:
          kind: test
          path: Tests/WALIEngineTests
          dependencies:
            - WALIEngine
    target:
      products:
        WALIModel:
          kind: library
          linkage: static
          targets:
            - WALIModel
        WALIWire:
          kind: library
          linkage: static
          targets:
            - WALIWire
        WALIEngine:
          kind: library
          linkage: static
          targets:
            - WALIEngine
      targets:
        WALIModel:
          kind: regular
          path: Sources/WALIModel
          dependencies: []
        WALIWire:
          kind: regular
          path: Sources/WALIWire
          dependencies:
            - WALIModel
        WALIEngine:
          kind: regular
          path: Sources/WALIEngine
          dependencies:
            - WALIModel
        WALIModelTests:
          kind: test
          path: Tests/WALIModelTests
          dependencies:
            - WALIModel
        WALIWireTests:
          kind: test
          path: Tests/WALIWireTests
          dependencies:
            - WALIWire
        WALIEngineTests:
          kind: test
          path: Tests/WALIEngineTests
          dependencies:
            - WALIEngine

xcode_test_targets:
  WALIAppTests:
    type: bundle.unit-test
    source_path: Tests/WALIAppTests
    build_dependencies:
      - WALIAppRuntime
    package_dependencies: []
  WALIAgentTests:
    type: bundle.unit-test
    source_path: Tests/WALIAgentTests
    build_dependencies:
      - WALIAgentRuntime
    package_dependencies: []
  WALITranscoderTests:
    type: bundle.unit-test
    source_path: Tests/WALITranscoderTests
    build_dependencies:
      - WALITranscoderRuntime
    package_dependencies: []
  WALIUITests:
    type: bundle.unit-test
    source_path: Tests/WALIUITests
    build_dependencies:
      - WALIUI
    package_dependencies: []
  WALIEndToEndTests:
    type: bundle.ui-testing
    source_path: UITests/WALIEndToEndTests
    build_dependencies:
      - WALI
    package_dependencies: []

modules:
  WALICore:
    presence: absent
    source_path: Packages/WALICore/Sources/WALICore
    owner_role: architecture_maintainer
    stability: transitional
    current_capabilities: []
    target_responsibility: Retired imported module; WALICore remains only the local package reference and folder name.
    current_target: null
    target_target: null
    current_allowed_internal_imports: []
    target_allowed_internal_imports: []
    current_allowed_internal_reexports: []
    target_allowed_internal_reexports: []
    forbidden_frameworks:
      - Foundation
      - SwiftUI
      - AppKit
      - AVFoundation
      - VideoToolbox
      - Metal
      - SQLite3
      - CoreData
      - SwiftData
      - ServiceManagement
      - CloudKit
      - Network

  WALIModel:
    presence: current
    source_path: Packages/WALICore/Sources/WALIModel
    owner_role: domain_maintainer
    stability: stable_contract
    current_capabilities:
      - module_availability_marker
      - validated_immutable_model_records
      - playback_state_reducer
      - durable_import_job_reducer
    target_responsibility: Stable immutable identifiers, records, policies, and reducer state.
    current_target:
      build_system: swift_package
      name: WALIModel
      type: library.static
      package_reference: WALICore
      product: WALIModel
      target: WALIModel
    target_target:
      build_system: swift_package
      name: WALIModel
      type: library.static
      package_reference: WALICore
      product: WALIModel
      target: WALIModel
    current_allowed_internal_imports: []
    target_allowed_internal_imports: []
    current_allowed_internal_reexports: []
    target_allowed_internal_reexports: []
    forbidden_frameworks:
      - Foundation
      - SwiftUI
      - AppKit
      - AVFoundation
      - VideoToolbox
      - Metal
      - SQLite3
      - CoreData
      - SwiftData
      - ServiceManagement
      - CloudKit
      - Network

  WALIWire:
    presence: current
    source_path: Packages/WALICore/Sources/WALIWire
    owner_role: ipc_maintainer
    stability: stable_contract
    current_capabilities:
      - module_availability_marker
      - bounded_versioned_agent_protocol
      - bounded_agent_worker_protocol
      - size_checked_wire_codecs
      - xpc_protocol_interfaces
    target_responsibility: Bounded versioned transport-neutral DTOs and stable wire errors.
    current_target:
      build_system: swift_package
      name: WALIWire
      type: library.static
      package_reference: WALICore
      product: WALIWire
      target: WALIWire
    target_target:
      build_system: swift_package
      name: WALIWire
      type: library.static
      package_reference: WALICore
      product: WALIWire
      target: WALIWire
    current_allowed_internal_imports:
