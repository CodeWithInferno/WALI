    source_path: Tests/WALIAppTests
    build_dependencies:
      - WALIAppRuntime
      - WALICatalogRuntime
      - WALIUI
    package_dependencies:
      - WALIModel
      - WALIWire
      - WALICatalog
  WALICatalogRuntimeTests:
    type: bundle.unit-test
    source_path: Tests/WALICatalogRuntimeTests
    build_dependencies:
