    current_capabilities: []
    target_responsibility: Retired imported module; WALICore remains only the local package reference and folder name.
    current_target: null
    target_target: null
    current_allowed_internal_imports: []
    target_allowed_internal_imports: []
    current_allowed_internal_reexports: []
    target_allowed_internal_reexports: []
    forbidden_frameworks:
      - Foundation
