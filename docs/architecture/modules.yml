    target_allowed_internal_imports:
      - WALIModel
    current_allowed_internal_reexports: []
    target_allowed_internal_reexports: []
    forbidden_frameworks:
      - SwiftUI
      - AppKit
      - AVFoundation
      - VideoToolbox
      - Metal
      - SQLite3
      - CoreData
      - SwiftData
      - ServiceManagement
      - CloudKit
      - Network

  WALIEngine:
    presence: current
    source_path: Packages/WALICore/Sources/WALIEngine
    owner_role: engine_maintainer
    stability: stable_interface
    current_capabilities:
