schema_version: 1
policy_id: wali-marketplace-data-v1
status: accepted
implementation_status: policy_contract_not_deployment_evidence
owner_role: security_responder
accepted_by: project_owner
approval_reference: project-owner AFK marketplace implementation directive 2026-09-01

# Production email observations, 2026-09-10, under accepted ADR 0022:
# Supabase Auth processes email-code requests, verification, and account/session
# state. Configured Resend delivery processes recipient email addresses,
# authentication-message contents (including the code), and delivery metadata.
# Provider reference: https://resend.com/legal/dpa (Exhibit A).
# These observations do not change the accepted collection/logging restrictions
# or retention/deletion rules below. They do not establish provider retention,
# tracking settings, deletion, or backup behavior; those require separate evidence.
# The operator/contact and draft user disclosure are in docs/legal/privacy-policy.md.
# Outside-team delivery and API-only auth results, with native checks still pending,
# are recorded in docs/release/2026-09-10-production-auth-status.md.

# ADR0023: staff-curated sessions retain their actual uploading subject and
# immutable admission_kind. Rights declarations pair their historic version
# column with attestation_document_kind; catalog acceptance is never Creator
# Terms acceptance. Curated owner reads/writes require admin AAL2, and public
# creator projections exclude these private submissions. Existing retention,
# account export, deletion, legal hold, and independent review continue to apply.
# runtime_configuration adds a nullable catalog_license_attestation_version;
# creator_terms_version may remain null without disabling public catalog reads.
# No new private document store, tracking, or provider is introduced.

defaults:
  encryption_in_transit: required
  encryption_at_rest: required
  raw_ip_storage: forbidden
  secret_or_token_logging: forbidden
  private_data_public_cache: forbidden
  deletion_mode: tombstone_then_bounded_cleanup
  backup_restore_test: required

