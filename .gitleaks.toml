title = "WALI source secret scan"

[extend]
useDefault = true

# Public SHA-256 of the synthetic sb_publishable_ + 32 x characters fixture.
# Match this exact checksum, field, path, and rule; other fixture content stays scanned.
[[allowlists]]
description = "Known public checksum in the production configuration test vector"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^Fixtures/Release/production-config-v1\.json$''']
regexTarget = "line"
regexes = ['''^\s*"WALI_SUPABASE_PUBLISHABLE_KEY_SHA256": "7502b9282656dc13e73c37a7be79201b9b4c5d65cce3498391566ab84cf926e0",?\s*$''']

# Verified public production client key. Only this complete reviewed line is exempt.
# Gitleaks 8.30.1's Line slice can include the preceding newline delimiter.
[[allowlists]]
description = "Reviewed public production publishable key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^Config/Marketplace\.production\.json$''']
regexTarget = "line"
regexes = ['''^\n?    "WALI_SUPABASE_PUBLISHABLE_KEY": "sb_publishable_DmzCmnDk_nKorEciLeq2ng_KiOvSkXS",$''']

[[allowlists]]
description = "Reviewed public production publishable-key checksum"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^Config/Marketplace\.production\.json$''']
regexTarget = "line"
regexes = ['''^\n?    "WALI_SUPABASE_PUBLISHABLE_KEY_SHA256": "4d9c2b130f7b4c46abfe86485d5e87ef3298763619bd37d8821a149cc876ee6e",$''']

# Public deterministic Base32 test vector used only by the synthetic MFA server.
# Scope the exception to this exact complete line, test file and detector rule.
[[allowlists]]
description = "Known deterministic MFA enrollment test vector"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^Tests/WALICatalogRuntimeTests/SupabaseMFASessionTests\.swift$''']
regexTarget = "line"
regexes = ['''^\n?        let secret = "GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ"$''']
